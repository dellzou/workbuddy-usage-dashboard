name: Build Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller pillow

      - name: Build single-file exe
        run: >
          pyinstaller --onefile --console --clean --noconfirm
          --name "WorkBuddyUsageDashboard"
          --icon app.ico
          --add-data "web;web"
          main.py

      - name: Smoke test
        run: |
          Start-Process -FilePath "dist\WorkBuddyUsageDashboard.exe" -ArgumentList "--demo","--once","--no-browser" -Wait -NoNewWindow

      - uses: actions/upload-artifact@v4
        with:
          name: WorkBuddyUsageDashboard-exe
          path: dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
